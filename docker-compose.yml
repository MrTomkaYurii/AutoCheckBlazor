services:
  autocheck:
    build: .
    image: autocheck-blazor:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__Model=${GEMINI_MODEL:-gemini-2.5-flash}
      - Gemini__DailyLimit=${GEMINI_DAILY_LIMIT:-50}
      - Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}
      - Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}
      - Email__SmtpHost=${SMTP_HOST:-}
      - Email__SmtpPort=${SMTP_PORT:-587}
      - Email__SmtpUser=${SMTP_USER:-}
      - Email__SmtpPassword=${SMTP_PASSWORD:-}
      - Email__From=${SMTP_FROM:-}
      - Email__FromName=${SMTP_FROM_NAME:-AutoCheck}
      # Off-host backup mirror — leave empty to disable
      - Backup__Git__RemoteUrl=${BACKUP_GIT_REMOTE_URL:-}
      - Backup__Git__Token=${BACKUP_GIT_TOKEN:-}
      - Backup__Git__KeepLast=${BACKUP_GIT_KEEP_LAST:-14}
      - Backup__Git__UserName=${BACKUP_GIT_USER_NAME:-AutoCheck Backup}
      - Backup__Git__UserEmail=${BACKUP_GIT_USER_EMAIL:-backup@autocheck.local}
    volumes:
      - autocheck-data:/app/data
      - autocheck-backups:/app/backups
      - autocheck-dpkeys:/app/dp-keys
      - autocheck-backup-repo:/app/backup-repo

volumes:
  autocheck-data:
  autocheck-backups:
  autocheck-dpkeys:
  autocheck-backup-repo:
