name: Deploy

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "_design/**"
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Self-contained publish — the VPS is an unprivileged LXC container where Docker
      # can't run, so we ship a plain .NET app + bundled runtime and run it via systemd.
      # InvariantGlobalization is already set in the csproj, so no ICU on the server.
      - name: Publish
        run: |
          dotnet publish AutoCheck.csproj -c Release \
            -r linux-x64 --self-contained true \
            -p:PublishTrimmed=false -p:UseAppHost=true \
            -o publish
          tar -C publish -czf autocheck.tar.gz .

      # The provider only exposes SSH over an IPv4 proxy (VPS is IPv6-only), so
      # VPS_HOST / VPS_PORT point at that proxy.
      - name: Copy artifact + deploy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "autocheck.tar.gz,deploy/autocheck.service,deploy/Caddyfile"
          target: "/opt/autocheck/incoming"
          overwrite: true

      - name: Release on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          SEED_DEFAULT_PASSWORD: ${{ secrets.SEED_DEFAULT_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_DAILY_LIMIT: ${{ vars.GEMINI_DAILY_LIMIT }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          BACKUP_GIT_REMOTE_URL: ${{ secrets.BACKUP_GIT_REMOTE_URL }}
          BACKUP_GIT_TOKEN: ${{ secrets.BACKUP_GIT_TOKEN }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: SEED_DEFAULT_PASSWORD,GEMINI_API_KEY,GEMINI_MODEL,GEMINI_DAILY_LIMIT,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SMTP_HOST,SMTP_PORT,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,SMTP_FROM_NAME,BACKUP_GIT_REMOTE_URL,BACKUP_GIT_TOKEN,APP_DOMAIN
          script: |
            set -euo pipefail
            APP=/opt/autocheck
            IN=$APP/incoming
            TS=$(date +%Y%m%d-%H%M%S)
            REL=$APP/releases/$TS

            mkdir -p "$REL" "$APP/data"
            tar -C "$REL" -xzf "$IN/autocheck.tar.gz"
            chmod +x "$REL/AutoCheck"

            # Secrets → env file (root-owned, group-readable by the service user).
            # Optional values are passed through the environment and only written when
            # non-empty — an empty line here would override the appsettings.json default.
            umask 077
            {
              cat <<EOF
            ASPNETCORE_ENVIRONMENT=Production
            ASPNETCORE_URLS=http://127.0.0.1:8080
            ConnectionStrings__Default=Data Source=$APP/data/autocheck.db
            Backup__Dir=$APP/data/backups
            Settings__File=$APP/data/settings.override.json
            DataProtection__KeyPath=$APP/data/dp-keys
            Grading__WorkRoot=$APP/data/repos
            ForwardedHeaders__KnownNetworks=127.0.0.1/32 ::1/128
            EOF
              for kv in \
                "Seed__DefaultPassword=${SEED_DEFAULT_PASSWORD:-}" \
                "Gemini__ApiKey=${GEMINI_API_KEY:-}" \
                "Gemini__Model=${GEMINI_MODEL:-}" \
                "Gemini__DailyLimit=${GEMINI_DAILY_LIMIT:-}" \
                "Authentication__Google__ClientId=${GOOGLE_CLIENT_ID:-}" \
                "Authentication__Google__ClientSecret=${GOOGLE_CLIENT_SECRET:-}" \
                "Email__SmtpHost=${SMTP_HOST:-}" \
                "Email__SmtpPort=${SMTP_PORT:-}" \
                "Email__SmtpUser=${SMTP_USER:-}" \
                "Email__SmtpPassword=${SMTP_PASSWORD:-}" \
                "Email__From=${SMTP_FROM:-}" \
                "Email__FromName=${SMTP_FROM_NAME:-}" \
                "Backup__Git__RemoteUrl=${BACKUP_GIT_REMOTE_URL:-}" \
                "Backup__Git__Token=${BACKUP_GIT_TOKEN:-}" ; do
                [ "${kv#*=}" != "" ] && echo "$kv"
              done
            } > "$APP/app.env"
            chown root:autocheck "$APP/app.env"
            chmod 640 "$APP/app.env"

            # systemd unit
            install -m644 "$IN/deploy/autocheck.service" /etc/systemd/system/autocheck.service

            # Caddy config + domain (injected as an env var for the caddy service)
            install -m644 "$IN/deploy/Caddyfile" /etc/caddy/Caddyfile
            mkdir -p /etc/systemd/system/caddy.service.d
            cat > /etc/systemd/system/caddy.service.d/override.conf <<EOF
            [Service]
            Environment=APP_DOMAIN=${{ secrets.APP_DOMAIN }}
            EOF

            # Activate the new release
            ln -sfn "$REL" "$APP/current"
            chown -h autocheck:autocheck "$APP/current"
            chown -R autocheck:autocheck "$REL" "$APP/data"

            systemctl daemon-reload
            systemctl enable --now autocheck
            systemctl restart autocheck
            systemctl restart caddy

            # Keep only the 5 most recent releases
            ls -1dt "$APP"/releases/*/ | tail -n +6 | xargs -r rm -rf
            rm -f "$IN/autocheck.tar.gz"

            # Health check — fail the deploy if the app doesn't come up
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
                echo "healthy"; exit 0
              fi
              sleep 2
            done
            echo "app did not become healthy — recent logs:" >&2
            journalctl -u autocheck -n 40 --no-pager >&2
            exit 1
